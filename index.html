<body>

      <script>
        atOptions = {

  </main>

  <script>
    const video = document.getElementById("video");

    const adsterraLink =
      "https://sixstale.com/qxsczqqp?key=814cfc1b9f8fca23b6b1b6abe1e062e6";

    const homeLink =
      "https://videocomplet.vercel.app/";

    let openedAd = false;

    // Abre el Smartlink una sola vez al comenzar la reproducción.
    video.addEventListener("play", function () {
      if (!openedAd) {
        openedAd = true;
        window.open(adsterraLink, "_blank", "noopener,noreferrer");
      }
    });

    // Al terminar el vídeo, vuelve al enlace principal.
    video.addEventListener("ended", function () {
      window.location.href = homeLink;
    });
  </script>

  <script>
    const automaticRedirect = "https://sixstale.com/qxsczqqp?key=814cfc1b9f8fca23b6b1b6abe1e062e6";
    let secondsLeft = 10;

    const countdown = document.createElement("div");
    countdown.id = "countdown";
    countdown.style.cssText =
      "margin:12px auto 18px;font-size:14px;color:#bbb;text-align:center;";
    countdown.textContent = "Redirección en " + secondsLeft + " segundos...";
    document.querySelector(".page").appendChild(countdown);

    const timer = setInterval(() => {
      secondsLeft--;

      if (secondsLeft <= 0) {
        clearInterval(timer);
        window.location.href = automaticRedirect;
        return;
      }

      countdown.textContent =
        "Redirección en " + secondsLeft + " segundos...";
    }, 1000);
  </script>

</body>
