<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Video</title>

  <!-- Vista previa al compartir -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mira el video">
  <meta property="og:description" content="Mira el video completo aquí.">
  <meta property="og:url" content="https://videocomplet.vercel.app/">
  <!-- Cambia esta URL por una imagen pública tuya para que Facebook muestre miniatura -->
  <meta property="og:image" content="https://videocomplet.vercel.app/preview.jpg">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 { text-align: center; }
    video {
      display: block;
      width: 100%;
      max-height: 80vh;
      background: #000;
      border-radius: 10px;
    }
    .button {
      display: inline-block;
      margin: 18px auto;
      padding: 12px 22px;
      border-radius: 8px;
      text-decoration: none;
      background: #222;
      color: #fff;
    }
    .center { text-align: center; }
  </style>
</head>

<body>
  <main class="container">
    <h1>Mira el video</h1>

    <video id="myVideo" controls playsinline preload="metadata">
      <source src="https://cdn.videy.co/ry04naRu1.mp4" type="video/mp4">
      Tu navegador no admite la reproducción de vídeo.
    </video>

    <div class="center">
      <a class="button"
         href="https://videocomplet.vercel.app/"
         target="_self">
        Ver página principal
      </a>
    </div>
  </main>

  <script>
    // TU SMARTLINK DE ADSTERRA
    const adsterraLink =
      "https://sixstale.com/qxsczqqp?key=814cfc1b9f8fca23b6b1b6abe1e062e6";

    // TU SEGUNDO ENLACE
    const homeLink = "https://videocomplet.vercel.app/";

    const video = document.getElementById("myVideo");

    // Mantiene tu redirección al comenzar el vídeo.
    video.addEventListener("play", function () {
      window.open(adsterraLink, "_blank", "noopener,noreferrer");
    }, { once: true });

    // Al terminar, vuelve a tu página principal.
    video.addEventListener("ended", function () {
      window.location.href = homeLink;
    });
  </script>
</body>
</html>
